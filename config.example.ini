# Copy this file to config.ini and adjust. Every key is optional;
# anything left out falls back to the defaults shown here.

[llm]
# Leave empty to use the OPENAI_API_KEY environment variable.
api_key =
model = gpt-4o-mini
temperature = 0
# Any OpenAI-compatible server works, e.g. http://localhost:11434/v1 for Ollama.
# Leave empty for api.openai.com (or set OPENAI_BASE_URL).
base_url =

[tools]
# github : your real GitHub issues (set the repo below, or pass --repo owner/name)
# devrev : offline mock of the DevRev API, the original demo; needs no account
toolkit = devrev

[github]
# Repository to work on, as owner/name.
repo =
# Leave empty to use GITHUB_TOKEN (or GH_TOKEN). Public repositories can be
# read without a token; making changes (--apply) needs one with Issues: write.
token =
# For GitHub Enterprise Server: https://github.example.com/api/v3
api_url = https://api.github.com

[retriever]
# Use your own tool docs instead of the toolkit's bundled ones.
docs_dir =
# Where the search index is cached. Default: ~/.cache/reversegpt/index/<toolkit>
index_dir =
embedding_model = sentence-transformers/all-MiniLM-L6-v2
# How many candidate APIs are shown to the model at each decision.
top_k = 5

[agent]
# Upper bound on planner steps for one request.
max_plan_steps = 8
# How far back Reverse Chain may go to produce a missing argument.
max_chain_depth = 3

[output]
output_path = output/output.json
log_path = logs/run.log
